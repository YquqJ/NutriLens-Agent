[project]
name = "nutrilens-backend"
version = "0.1.0"
description = "NutriLens 健康管理智能助手后端 —— 基于 LangGraph 的多 Agent 健康管理服务"
authors = [
    { name = "QAQ2333", email = "827199525@qq.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    # ---- Web 框架 ----
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.20",        # 文件上传（multipart/form-data）
    # ---- 数据库 ----
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",             # PostgreSQL 异步/同步驱动
    "pgvector>=0.3",                    # pgvector 的 SQLAlchemy 集成（向量列类型）
    # ---- 配置与认证 ----
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "bcrypt>=4.2",                      # 密码哈希（弃用 passlib，规避其与 bcrypt>=4 的兼容问题）
    # ---- 阿里云 OSS ----
    "oss2>=2.19",
    # ---- LLM / Agent ----
    "openai>=1.60",                     # DashScope 兼容模式统一走 OpenAI SDK
    "langgraph>=0.4,<0.5",              # 多 Agent 编排（interrupt/Command 为 0.2+ 语法，锁定 0.4.x）
    "langgraph-prebuilt>=0.2,<0.5",     # 显式上界：langgraph 0.4.10 只声明 prebuilt>=0.2.0 无上界，
                                        # 不锁会解析到 1.1.0（配套 langgraph 1.x）导致 import 崩溃
    "langgraph-checkpoint-postgres>=3.0,<4.0",     # 必须 3.x：langgraph 0.4.10 的 pregel 会往
                                        # checkpoint 写 pending_sends（含 Send 对象），2.x 的
                                        # put 用原生 json.dumps 落库直接 TypeError；3.x 才有对应
                                        # 序列化支持。3.x 对 langgraph<0.5 的 DeprecationWarning
                                        # 是版本嗅探过于保守（见 DESIGN_NOTES），功能实测正常
    "langchain-core>=0.3",
    "langchain-openai>=0.3",            # ChatOpenAI 配 DashScope base_url 调 Qwen
    "rank-bm25>=0.2",                   # BM25 关键词检索（混合检索的其中一路）
    "pypdf>=5.0",                       # PDF 文本层提取（知识文档导入）
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",                      # FastAPI TestClient 依赖
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["eval: 真实 RAG 评测，需 DASHSCOPE_API_KEY 与 seeded 数据库"]
